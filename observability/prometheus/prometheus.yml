global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: a3-fsm-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: backend
          component: spring-boot

  - job_name: a3-fsm-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres
          component: database

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus
          component: monitoring

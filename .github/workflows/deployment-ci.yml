name: Deployment CI

on:
  push:
    branches:
      - main
      - sprint-10-demo-readiness
  pull_request:
    branches:
      - main
      - sprint-10-demo-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Deployment Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env.ci <<'EOF'
          DB_NAME=a3fsm
          DB_USERNAME=a3fsm_user
          DB_PASSWORD=a3fsm_password
          SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/a3fsm
          SPRING_DATASOURCE_USERNAME=a3fsm_user
          SPRING_DATASOURCE_PASSWORD=a3fsm_password
          BACKEND_IMAGE=ghcr.io/skawuma/a3-fsm-backend:sprint-10-demo-readiness
          FRONTEND_IMAGE=ghcr.io/skawuma/a3-fsm-frontend:sprint-10-demo-readiness
          SPRING_PROFILES_ACTIVE=prod,demo
          DEMO_DATA_ENABLED=true
          FSM_DOMAIN=fsm.example.com
          GRAFANA_DOMAIN=grafana.example.com
          ACME_EMAIL=admin@example.com
          PGADMIN_EMAIL=admin@example.com
          PGADMIN_PASSWORD=pgadmin_password
          JWT_EXPIRATION=3600000
          JWT_REFRESH_EXPIRATION=604800000
          JWT_SECRET=test-secret-key-with-at-least-thirty-two-bytes
          APP_CORS_ALLOWED_ORIGINS=http://localhost:4200
          CORS_ALLOWED_ORIGINS=http://localhost:4200
          SPRING_FLYWAY_ENABLED=true
          SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
          APP_AUTH_ALLOW_SELF_REGISTRATION=false
          APP_AUTH_ALLOW_ADMIN_BOOTSTRAP=false
          APP_AUTH_BOOTSTRAP_ADMIN_EMAIL=
          APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD=
          GF_SECURITY_ADMIN_USER=admin
          GF_SECURITY_ADMIN_PASSWORD=grafana_password
          EOF

      - name: Create CI-only compose build placeholders
        run: |
          mkdir -p "A3 Field Service Management Backend"
          mkdir -p "A3 Field Service Management Frontend/a3-fsm-frontend"
          printf 'FROM scratch\n' > "A3 Field Service Management Backend/Dockerfile"
          printf 'FROM scratch\n' > "A3 Field Service Management Frontend/a3-fsm-frontend/Dockerfile"
          mkdir -p secrets
          printf 'test-secret-key-with-at-least-thirty-two-bytes\n' > secrets/jwt_secret.txt

      - name: Validate dev Compose config
        run: docker compose --env-file .env.ci -f docker-compose.dev.yml config --quiet

      - name: Validate prod Compose config
        run: docker compose --env-file .env.ci -f docker-compose.prod.yml config --quiet

      - name: Validate GHCR Compose config
        run: docker compose --env-file .env.ci -f docker-compose.ghcr.yml config --quiet

      - name: Validate Prometheus config
        run: docker run --rm --entrypoint promtool -v "${{ github.workspace }}/observability/prometheus:/etc/prometheus:ro" prom/prometheus:latest check config /etc/prometheus/prometheus.yml

      - name: Validate Grafana dashboard JSON
        run: jq empty observability/grafana/dashboards/*.json

services:
  caddy:
    image: caddy:2-alpine
    container_name: a3fsm_caddy_prod
    restart: unless-stopped
    environment:
      FSM_DOMAIN: ${FSM_DOMAIN}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      grafana:
        condition: service_started
    networks:
      - a3fsm_network

  db:
    image: postgres:16
    container_name: a3fsm_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/postgresql/data
      - ./db_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - a3fsm_network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/skawuma/a3-fsm-backend:sprint-9-production-devops}
    pull_policy: always
    container_name: a3fsm_backend_prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/${DB_NAME}}
      DB_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${DB_USERNAME}}
      DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${DB_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      APP_BOOTSTRAP_DEMO_DATA: "false"
      APP_AUTH_ALLOW_SELF_REGISTRATION: ${APP_AUTH_ALLOW_SELF_REGISTRATION:-false}
      APP_AUTH_ALLOW_ADMIN_BOOTSTRAP: ${APP_AUTH_ALLOW_ADMIN_BOOTSTRAP:-false}
      APP_AUTH_BOOTSTRAP_ADMIN_EMAIL: ${APP_AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${APP_AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      SERVER_PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${APP_CORS_ALLOWED_ORIGINS}}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_prod:/app/uploads
    secrets:
      - jwt_secret
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - a3fsm_network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/skawuma/a3-fsm-frontend:sprint-9-production-devops}
    pull_policy: always
    container_name: a3fsm_frontend_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - a3fsm_network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: a3fsm_postgres_exporter_prod
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - a3fsm_network

  prometheus:
    image: prom/prometheus:latest
    container_name: a3fsm_prometheus_prod
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
    networks:
      - a3fsm_network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: a3fsm_grafana_prod
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-${GRAFANA_ADMIN_USER:-admin}}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-${GRAFANA_ADMIN_PASSWORD:-}}
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - a3fsm_network

networks:
  a3fsm_network:

volumes:
  caddy_data:
  caddy_config:
  db_data_prod:
  uploads_prod:
  prometheus_data_prod:
  grafana_data_prod:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
